<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111114" />
    <meta name="description" content="Seu espaço de treino: acompanhe as séries dos treinos A e B, no seu ritmo." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Ritmo — seu espaço de treino</title>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div id="app"></div>
    <dialog id="exercise-dialog" class="exercise-dialog" aria-labelledby="dialog-title">
      <button class="dialog-close" type="button" aria-label="Fechar explicação">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
      </button>
      <div class="dialog-art" id="dialog-art"></div>
      <div class="dialog-copy">
        <span id="dialog-muscle" class="eyebrow"></span>
        <h2 id="dialog-title"></h2>
        <p id="dialog-description" class="dialog-description"></p>
        <div class="tip-heading">
          <span class="tip-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9.5 18h5m-4.5 3h4m-2-20a7 7 0 0 0-4 12.75c.8.53 1.5 1.56 1.5 2.25h5c0-.69.7-1.72 1.5-2.25A7 7 0 0 0 12 1Z" /></svg></span>
          <h3>Dica de execução</h3>
        </div>
        <p id="dialog-tip" class="dialog-tip"></p>
      </div>
    </dialog>
    <script src="/app.js" defer></script>
  </body>
</html>
